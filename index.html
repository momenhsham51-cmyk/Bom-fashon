<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>BOOM FASHION | تسجيل الدخول</title>
    <style>
        body { font-family: 'Cairo', sans-serif; background: linear-gradient(135deg, #2b2b2b, #121212); min-height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; }
        .box { background: rgba(30, 30, 30, 0.8); backdrop-filter: blur(15px); padding: 40px; border-radius: 25px; width: 90%; max-width: 400px; text-align: center; border: 1px solid #d4af37; box-shadow: 0 10px 30px rgba(212, 175, 55, 0.2); }
        h1 { color: #d4af37; margin-bottom: 25px; letter-spacing: 3px; text-transform: uppercase; }
        .tabs { display: flex; gap: 10px; margin-bottom: 25px; }
        .tab-btn { flex: 1; padding: 12px; background: transparent; border: 1px solid #d4af37; color: #d4af37; border-radius: 10px; cursor: pointer; transition: 0.4s; }
        .tab-btn.active, .tab-btn:hover { background: #d4af37; color: #000; }
        input { width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #444; border-radius: 10px; background: #222; color: #fff; box-sizing: border-box; }
        button.submit-btn { width: 100%; padding: 15px; background: linear-gradient(45deg, #d4af37, #8b6508); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 16px; }
    </style>
</head>
<body>

<div class="box">
    <h1>BOOM FASHION</h1>
    <div class="tabs">
        <button class="tab-btn active" onclick="switchMode('register')">إنشاء حساب</button>
        <button class="tab-btn" onclick="switchMode('login')">تسجيل دخول</button>
    </div>
    <form id="authForm" onsubmit="window.location.href='dashboard.html'; return false;">
        <input type="text" id="nameField" placeholder="الاسم بالكامل" required>
        <input type="tel" placeholder="رقم الهاتف" required>
        <input type="password" placeholder="كلمة المرور" required>
        <button type="submit" class="submit-btn" id="btnText">إنشاء الحساب</button>
    </form>
</div>

<script>
    function switchMode(mode) {
        const nameField = document.getElementById('nameField');
        const btnText = document.getElementById('btnText');
        const btns = document.querySelectorAll('.tab-btn');
        btns.forEach(b => b.classList.toggle('active'));
        if(mode === 'login') { nameField.style.display = 'none'; btnText.innerText = 'تسجيل الدخول'; }
        else { nameField.style.display = 'block'; btnText.innerText = 'إنشاء الحساب'; }
    }
</script>
</body>
</html>
