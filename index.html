<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOM FASHION</title>
    <style>
        body { font-family: sans-serif; background: #f9f9f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; }
        h1 { color: #2d3436; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; background: #eee; border: none; border-radius: 10px; cursor: pointer; }
        .tab-btn.active { background: #6c5ce7; color: white; }
        .input-group { text-align: right; margin-bottom: 15px; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; margin-top: 5px; }
        .password-container { position: relative; }
        .toggle-password { position: absolute; left: 10px; top: 35px; cursor: pointer; }
        .forgot-pass { color: #0984e3; font-size: 14px; margin-top: 10px; display: block; text-align: right; }
        button.submit-btn { width: 100%; padding: 15px; background: #6c5ce7; color: white; border: none; border-radius: 8px; margin-top: 20px; }
    </style>
</head>
<body>
<div class="box">
    <h1>BOOM FASHION</h1>
    <div class="tabs">
        <button class="tab-btn active" id="regTab" onclick="switchMode('reg')">إنشاء حساب</button>
        <button class="tab-btn" id="logTab" onclick="switchMode('log')">تسجيل دخول</button>
    </div>
    <form>
        <div class="input-group" id="nameGroup"><label>الاسم بالكامل</label><input type="text"></div>
        <div class="input-group" id="emailGroup"><label>البريد الإلكتروني</label><input type="email"></div>
        <div class="input-group"><label>رقم الهاتف</label><input type="tel"></div>
        <div class="input-group password-container">
            <label>كلمة المرور</label>
            <input type="password" id="pass" value="123456">
            <span class="toggle-password" onclick="togglePass()">👁️</span>
        </div>
        <a href="#" class="forgot-pass" id="forgot">هل نسيت كلمة السر؟</a>
        <button class="submit-btn" id="btnMain">إنشاء الحساب</button>
    </form>
</div>
<script>
    function togglePass() { let x = document.getElementById("pass"); x.type = (x.type === "password") ? "text" : "password"; }
    function switchMode(m) {
        document.getElementById('nameGroup').style.display = (m==='reg') ? 'block' : 'none';
        document.getElementById('emailGroup').style.display = (m==='reg') ? 'block' : 'none';
        document.getElementById('forgot').style.display = (m==='reg') ? 'none' : 'block';
        document.getElementById('btnMain').innerText = (m==='reg') ? 'إنشاء الحساب' : 'تسجيل الدخول';
        document.getElementById('regTab').className = (m==='reg') ? 'tab-btn active' : 'tab-btn';
        document.getElementById('logTab').className = (m==='log') ? 'tab-btn active' : 'tab-btn';
    }
</script>
</body>
</html>
