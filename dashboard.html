<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOM FASHION | لوحة التحكم</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; margin: 0; padding-bottom: 70px; }
        
        /* Header Stats */
        .top-bar { background: #1a1a1a; padding: 20px; border-bottom: 2px solid #d4af37; display: flex; justify-content: space-between; align-items: center; }
        .balance { color: #d4af37; font-weight: bold; font-size: 1.2em; }

        /* Grid */
        .grid { padding: 20px; display: grid; gap: 20px; }
        .card { background: #151515; border-radius: 15px; overflow: hidden; border: 1px solid #333; }
        .card img { width: 100%; height: 200px; object-fit: cover; background: #333; }
        .card-content { padding: 15px; }
        
        /* Bottom Navbar */
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #1a1a1a; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #333; }
        .nav-item { text-align: center; color: #888; font-size: 12px; }
        .nav-item.active { color: #d4af37; }
    </style>
</head>
<body>

<div class="top-bar">
    <div>أهلاً، محمد 👋</div>
    <div class="balance">الرصيد: 1,250 ج.م</div>
</div>

<div class="grid">
    <div class="card">
        <img src="https://via.placeholder.com/300" alt="منتج">
        <div class="card-content">
            <h3>كوتشي نايك بريميوم</h3>
            <p style="color: #d4af37; font-weight: bold;">الجملة: 200 ج.م</p>
            <button class="share-btn" style="width:100%; padding:10px; border:none; border-radius:8px; background:#d4af37;">مشاركة واتساب</button>
        </div>
    </div>
</div>

<div class="nav-bar">
    <div class="nav-item active">🏠<br>الرئيسية</div>
    <div class="nav-item">📊<br>المبيعات</div>
    <div class="nav-item">👤<br>حسابي</div>
    <div class="nav-item">⚙️<br>إعدادات</div>
</div>

</body>
</html>
